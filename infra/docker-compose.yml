# Eagles App — pilha completa numa VPS.
#
# O que NÃO está aqui, e por quê:
#   Redis          o Postgres cobre fila (pg-boss) e cache neste volume;
#                  um serviço a menos para operar, monitorar e fazer backup
#   Elasticsearch  a busca full-text do Postgres basta para centenas de pessoas
#   Kubernetes     absurdo nesta escala
#   MinIO          volume em disco resolve até dezenas de GB de anexos
#
# Uso:  docker compose -f infra/docker-compose.yml --env-file .env up -d --build
#
# Cabe numa VM de 1 GB (a gratuita do Google, por exemplo): uma réplica do app,
# Postgres, Caddy e o backup. O monitor é opcional (perfil `monitor`).

name: eagles

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificados — perder isto refaz o TLS do zero
      - caddy_config:/config
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL no .env — o Let's Encrypt exige um e-mail válido}
    depends_on:
      app:
        condition: service_healthy
    networks: [borda, interna]

  # Aplica as migrações e sai. O app só sobe depois que ela termina bem — antes,
  # as migrações viajavam na imagem e nada as aplicava (varredura de 11/10/2026).
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: eagles-app
    command: ['node', '--experimental-strip-types', 'migrate.ts']
    restart: 'no'
    environment:
      DATABASE_URL: postgres://eagles:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/eagles
    depends_on:
      postgres:
        condition: service_healthy
    user: '1000:1000'
    security_opt: [no-new-privileges:true]
    read_only: true
    networks: [interna]

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: eagles-app
    restart: unless-stopped
    # Uma réplica por padrão: cabe numa VM gratuita de 1 GB. Com memória
    # sobrando, APP_REPLICAS=2 permite trocar uma de cada vez no deploy. Cada
    # réplica tem o próprio contador de tentativas de login (ratelimit.ts).
    deploy:
      replicas: ${APP_REPLICAS:-1}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://eagles:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/eagles
      PUBLIC_ORIGIN: https://${DOMINIO}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      INVITE_TTL_DAYS: ${INVITE_TTL_DAYS:-7}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOGIN_MAX_POR_IP: ${LOGIN_MAX_POR_IP:-20}
      PORT: 3000
      # SEM estas duas, `getClientAddress()` devolve o IP do Caddy para TODO
      # mundo — e o limite de login por IP travaria a comunidade inteira numa
      # noite de PG, além de encher a auditoria com o IP errado.
      # XFF_DEPTH=1 porque há exatamente um proxy à frente: contar mais
      # deixaria alguém forjar o cabeçalho e se passar por outro IP.
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: 1
    volumes:
      # Anexos ficam FORA do diretório servido pela web (seção 16.4).
      - arquivos:/dados/arquivos
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Contêiner sem root e sem escalada de privilégio.
    user: '1000:1000'
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    networks: [interna]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # O "hoje" do banco é o da equipe: gatilhos e a view de idade usam
    # CURRENT_DATE, e em UTC ele vira o dia seguinte às 21h de Brasília.
    command: ['postgres', '-c', 'timezone=${FUSO:-America/Sao_Paulo}']
    # SEM `ports:` — o banco não fica exposto à internet. O acesso externo,
    # quando necessário, é por túnel SSH.
    environment:
      POSTGRES_DB: eagles
      POSTGRES_USER: eagles
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      # Locale pt-BR para ordenação correta de nomes com acento.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=pt-BR'
      LANG: pt_BR.utf8
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eagles -d eagles']
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    networks: [interna]

  backup:
    # Imagem própria: precisa do 'age' para cifrar e do 'rclone' para enviar.
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      RETENCAO_DIARIA: 7
      B2_BUCKET: ${B2_BUCKET:-}
      # O rclone lê o remoto `b2:` destas variáveis. Sem elas, a cópia externa
      # falhava sempre — só B2_BUCKET chegava ao contêiner (varredura).
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${B2_ACCOUNT_ID:-}
      RCLONE_CONFIG_B2_KEY: ${B2_APPLICATION_KEY:-}
      TZ: ${FUSO:-America/Sao_Paulo}
      # Chave PÚBLICA age. Só ela fica na VPS: quem invadir a máquina consegue
      # criar backups novos, mas não consegue ler nenhum dos antigos.
      # A chave privada fica fora daqui — ver infra/README.md.
      EAGLES_BACKUP_RECIPIENT: ${EAGLES_BACKUP_RECIPIENT:?defina EAGLES_BACKUP_RECIPIENT}
    volumes:
      - backups:/backups
      - arquivos:/dados/arquivos:ro
    entrypoint: ['/bin/sh', '-c']
    # Loop simples em vez de cron: um processo a menos para depurar quando
    # o backup não roda às 3h e ninguém percebe.
    command:
      - |
        while true; do
          agora=$$(date +%s)
          # As próximas 3h no fuso do contêiner (TZ). O `date` do busybox não
          # entende "tomorrow 03:00": antes, o backup caía 24h depois de o
          # contêiner subir, em hora nenhuma em especial (varredura).
          hoje=$$(date -d "$$(date +%Y-%m-%d) 03:00" +%s)
          if [ "$$hoje" -gt "$$agora" ]; then proxima=$$hoje; else proxima=$$((hoje + 86400)); fi
          sleep $$((proxima - agora))
          /bin/sh /backup.sh
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  # Opcional: `docker compose --profile monitor up -d`. Só escuta na própria
  # máquina — acesse com `ssh -L 3001:127.0.0.1:3001 <vps>` e crie a conta de
  # administrador na hora: a primeira pessoa que abre a tela é quem a cria.
  # Numa VM de 1 GB, prefira um monitor externo gratuito apontando para
  # /api/health.
  uptime:
    image: louislam/uptime-kuma:1
    profiles: [monitor]
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - uptime:/app/data
    networks: [interna]

volumes:
  pgdata:
  arquivos:
  backups:
  caddy_data:
  caddy_config:
  uptime:

networks:
  # Só o Caddy fica nas duas. Banco e app não alcançam a internet de entrada.
  borda:
  interna:
    internal: false
