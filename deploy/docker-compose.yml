services:
  db:
    image: postgres:16-alpine
    container_name: eagles-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-eagles}
    volumes:
      - eagles_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-eagles}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eagles_net

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: eagles-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eagles}?sslmode=disable
      # Obrigatório: sem ele a API recusa emitir e aceitar tokens. Gere com: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      FRONTEND_URL: ${FRONTEND_URL:?defina FRONTEND_URL no .env}
      # Usado nos links de convite e de redefinição de senha (env.ts exige).
      PUBLIC_ORIGIN: ${FRONTEND_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      # adapter-node: origem pública da própria API (protocolo e host corretos em event.url).
      ORIGIN: ${PUBLIC_API_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      WHATSAPP_CONSELHEIRO: ${WHATSAPP_CONSELHEIRO}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3001:3000"
    networks:
      - eagles_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  eagles_db_data:

networks:
  eagles_net:
    driver: bridge
