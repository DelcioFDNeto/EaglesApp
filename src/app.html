<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<!--
			Título e descrição padrão. Cada tela troca o título ao abrir; estes
			valem para quem lê a página sem executar JavaScript: o WhatsApp, o
			Telegram e os buscadores, ao montar a prévia de um link.
		-->
		<title>Eagles</title>
		<meta name="description" content="Encontros, PGs e escalas dos Eagles num só lugar." />

		<!--
			Prévia de links (Open Graph). A imagem precisa de endereço ABSOLUTO,
			por isso vem de PUBLIC_SITE_URL (definido em .env.production). O
			WhatsApp guarda a prévia em cache por endereço: links já enviados
			antes desta mudança continuam com a prévia antiga.
		-->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Eagles" />
		<meta property="og:locale" content="pt_BR" />
		<meta property="og:title" content="Eagles" />
		<meta property="og:description" content="Encontros, PGs e escalas dos Eagles num só lugar." />
		<meta property="og:url" content="%sveltekit.env.PUBLIC_SITE_URL%/" />
		<meta property="og:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og-eagles.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Logo dos Eagles: uma águia vermelha e branca" />
		<meta name="twitter:card" content="summary_large_image" />

		<link rel="icon" type="image/png" sizes="64x64" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#A91825" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#17090C" media="(prefers-color-scheme: dark)" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
